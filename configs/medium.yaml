# medium: 124,475,904 params. GPT-2 small's architecture with the vocab padded 50257 -> 50304.
model:
  vocab_size: 50304
  seq_len: 1024
  n_layers: 12
  n_heads: 12              # head_dim = 64
  d_model: 768
  d_ff: 3072
  dropout: 0.0
  attention_backend: reference
  norm_type: layernorm

data:
  dataset: random
  n_items: 8192
  seed: 0

train:
  max_steps: 1000
  micro_batch_size: 4
  grad_accum_steps: 8
  global_batch_size: 32
  lr: 2.5e-4
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  device: auto
  seed: 1337
  out_dir: runs/medium
  log_interval: 10
  eval_interval: 200
  eval_steps: 10
  ckpt_interval: 500
