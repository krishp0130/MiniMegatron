# small: 51,237,888 params.
model:
  vocab_size: 50304
  seq_len: 512
  n_layers: 8
  n_heads: 8               # head_dim = 64
  d_model: 512
  d_ff: 2048
  dropout: 0.0
  attention_backend: reference
  norm_type: layernorm

data:
  dataset: random
  n_items: 4096
  seed: 0

train:
  max_steps: 1000
  micro_batch_size: 8
  grad_accum_steps: 4
  global_batch_size: 32
  lr: 3.0e-4
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  device: auto
  seed: 1337
  out_dir: runs/small
  log_interval: 10
  eval_interval: 200
  eval_steps: 10
  ckpt_interval: 500
